<!DOCTYPE html>
<html lang="it" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Editor Markdown — {{ bucket_name }}</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  >
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  >
  <link
    rel="stylesheet"
    href="https://uicdn.toast.com/editor/3.2.2/toastui-editor.min.css"
  >
  <link
    rel="stylesheet"
    href="https://uicdn.toast.com/editor/3.2.2/theme/toastui-editor-dark.min.css"
  >
  <style>
    :root, [data-bs-theme="light"] {
      --bs-link-color: #495057;
      --bs-link-color-rgb: 73, 80, 87;
      --bs-link-hover-color: #212529;
      --bs-link-hover-color-rgb: 33, 37, 41;
    }
    [data-bs-theme="dark"] {
      --bs-link-color: #adb5bd;
      --bs-link-color-rgb: 173, 181, 189;
      --bs-link-hover-color: #f8f9fa;
      --bs-link-hover-color-rgb: 248, 249, 250;
    }
    .form-control:focus {
      border-color: #6c757d;
      box-shadow: 0 0 0 0.2rem rgba(108, 117, 125, 0.25);
    }
  </style>
  <script>
    (() => {
      const saved = localStorage.getItem('bsTheme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.setAttribute('data-bs-theme', saved);
      }
    })();
  </script>
</head>
<body class="bg-body-tertiary">
  <div class="container py-4">
    <!-- Top Bar -->
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
      <div class="d-flex align-items-center gap-2">
        <a href="{{ url_for('index', prefix=prefix) }}" class="btn btn-sm btn-outline-secondary">
          <i class="fa-solid fa-arrow-left me-1"></i>Torna alla cartella
        </a>
        <span class="text-body-secondary small">
          <i class="fa-regular fa-folder me-1"></i>/{{ prefix }}
        </span>
      </div>

      <div class="d-flex flex-wrap align-items-center gap-2">
        <div class="input-group input-group-sm" style="width: 260px;">
          <span class="input-group-text"><i class="fa-regular fa-file-lines"></i></span>
          <input
            type="text"
            class="form-control"
            id="filenameInput"
            value="{{ filename }}"
            placeholder="documento.md"
            aria-label="Nome file Markdown"
          >
        </div>

        <button type="button" class="btn btn-sm btn-secondary" id="saveMdBtn">
          <i class="fa-solid fa-floppy-disk me-1"></i>Salva .md
        </button>

        <button type="button" class="btn btn-sm btn-outline-secondary" id="downloadPdfBtn">
          <i class="fa-regular fa-file-pdf me-1"></i>Scarica PDF
        </button>

        <button type="button" class="btn btn-sm btn-outline-secondary" id="savePdfBucketBtn">
          <i class="fa-solid fa-cloud-arrow-up me-1"></i>Salva PDF nel bucket
        </button>

        <button
          type="button"
          class="btn btn-sm btn-outline-secondary"
          id="themeToggle"
          title="Cambia tema Chiaro/Scuro"
          aria-label="Cambia tema Chiaro/Scuro"
        >
          <i class="fa-solid fa-moon" id="themeIcon"></i>
        </button>
      </div>
    </div>

    {% if error %}
      <div class="alert alert-danger d-flex align-items-center gap-2" role="alert">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <div><strong>Errore:</strong> {{ error }}</div>
      </div>
    {% endif %}

    <div id="statusAlert" class="alert d-none py-2 small mb-3" role="alert"></div>

    <!-- Editor Container -->
    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div id="editorHost"></div>
      </div>
    </div>

    <!-- App Footer -->
    <footer class="border-top mt-4 pt-3 d-flex flex-wrap justify-content-between align-items-center gap-2 small text-body-secondary">
      <div>
        <i class="fa-brands fa-digital-ocean me-1"></i>Powered by <strong>DigitalOcean</strong>
      </div>
      <div class="d-flex flex-wrap align-items-center gap-3">
        <span>&copy; {{ current_year }} Developed by <strong>Igor Osio</strong></span>
        <a
          href="https://github.com/igorosio/s3.git"
          target="_blank"
          rel="noopener noreferrer"
          class="text-decoration-none"
        >
          <i class="fa-brands fa-github me-1"></i>GitHub
        </a>
        <a
          href="https://www.linkedin.com/in/igorosio/"
          target="_blank"
          rel="noopener noreferrer"
          class="text-decoration-none"
        >
          <i class="fa-brands fa-linkedin me-1"></i>LinkedIn
        </a>
      </div>
    </footer>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>
  <script src="https://uicdn.toast.com/editor/3.2.2/toastui-editor-all.min.js"></script>
  <script>
    const PREFIX = {{ prefix|tojson }};
    const INITIAL_CONTENT = {{ content|tojson }};
    const CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

    const statusAlert = document.getElementById('statusAlert');
    const filenameInput = document.getElementById('filenameInput');
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    function showStatus(message, type = 'secondary') {
      statusAlert.className = `alert alert-${type} py-2 small mb-3`;
      statusAlert.textContent = message;
      statusAlert.classList.remove('d-none');
    }

    function getTheme() {
      return document.documentElement.getAttribute('data-bs-theme') || 'light';
    }

    function createEditor(initialValue) {
      const host = document.getElementById('editorHost');
      host.innerHTML = '';
      return new toastui.Editor({
        el: host,
        height: '72vh',
        initialEditType: 'wysiwyg',
        previewStyle: 'vertical',
        initialValue: initialValue,
        theme: getTheme() === 'dark' ? 'dark' : 'default',
        usageStatistics: false,
      });
    }

    let editor = createEditor(INITIAL_CONTENT);

    function syncThemeIcon() {
      themeIcon.className = getTheme() === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    }
    syncThemeIcon();

    themeToggle.addEventListener('click', () => {
      const next = getTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-bs-theme', next);
      localStorage.setItem('bsTheme', next);
      syncThemeIcon();
      const currentMd = editor.getMarkdown();
      editor.destroy();
      editor = createEditor(currentMd);
    });

    document.getElementById('saveMdBtn').addEventListener('click', async () => {
      const filename = filenameInput.value.trim();
      if (!filename) {
        showStatus('Inserisci un nome per il file Markdown.', 'danger');
        return;
      }

      showStatus('Salvataggio in corso...', 'secondary');
      try {
        const res = await fetch('/api/markdown/save', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': CSRF_TOKEN,
          },
          body: JSON.stringify({
            prefix: PREFIX,
            filename: filename,
            content: editor.getMarkdown(),
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          showStatus(data.error || 'Errore durante il salvataggio.', 'danger');
          return;
        }
        filenameInput.value = data.filename;
        showStatus(`File "${data.filename}" salvato nel bucket.`, 'secondary');
      } catch (err) {
        showStatus('Errore di rete durante il salvataggio.', 'danger');
      }
    });

    document.getElementById('downloadPdfBtn').addEventListener('click', async () => {
      const filename = filenameInput.value.trim() || 'documento.md';
      showStatus('Generazione PDF in corso...', 'secondary');
      try {
        const res = await fetch('/api/markdown/pdf', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': CSRF_TOKEN,
          },
          body: JSON.stringify({
            prefix: PREFIX,
            filename: filename,
            content: editor.getMarkdown(),
            save_to_bucket: false,
          }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          showStatus(data.error || 'Errore durante la generazione del PDF.', 'danger');
          return;
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const base = filename.toLowerCase().endsWith('.md') ? filename.slice(0, -3) : filename;
        a.href = url;
        a.download = `${base}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showStatus(`PDF "${base}.pdf" scaricato.`, 'secondary');
      } catch (err) {
        showStatus('Errore di rete durante la generazione del PDF.', 'danger');
      }
    });

    document.getElementById('savePdfBucketBtn').addEventListener('click', async () => {
      const filename = filenameInput.value.trim() || 'documento.md';
      showStatus('Generazione e salvataggio PDF nel bucket...', 'secondary');
      try {
        const res = await fetch('/api/markdown/pdf', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': CSRF_TOKEN,
          },
          body: JSON.stringify({
            prefix: PREFIX,
            filename: filename,
            content: editor.getMarkdown(),
            save_to_bucket: true,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          showStatus(data.error || 'Errore durante il salvataggio del PDF.', 'danger');
          return;
        }
        showStatus(`PDF "${data.filename}" salvato nel bucket.`, 'secondary');
      } catch (err) {
        showStatus('Errore di rete durante il salvataggio del PDF.', 'danger');
      }
    });
  </script>
</body>
</html>
